name: Browser interaction QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install test-only browser harness
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Exercise custom controls and sheet swipes
        run: |
          node tests/browser-qa.mjs
          node tests/dramaturgy-browser-qa.mjs
          node tests/audio-browser-qa.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mousetrap-ui-screenshots
          path: test-results/
          if-no-files-found: ignore
