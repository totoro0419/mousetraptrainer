name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Generate PWA icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
          convert assets/pwa-icon-regular.webp -resize '192x192!' PNG24:dist/icon-192.png
          convert assets/pwa-icon-regular.webp -resize '512x512!' PNG24:dist/icon-512.png
          convert assets/pwa-icon-maskable.webp -resize '512x512!' PNG24:dist/icon-maskable-512.png
      - name: Verify application and bundled script
        run: |
          npm test
          npm run build
      - name: Save generated icons to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/icon-192.png dist/icon-512.png dist/icon-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Apply new book-and-stage PWA icon assets'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
