name: Inspect staged audio batches
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staged-audio:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/integrated-audio-rehearsal-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify every currently staged MP3 against the audited manifest
        run: python3 scripts/stage-audio-batch.py --status
